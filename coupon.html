<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow,noarchive">
<meta name="referrer" content="no-referrer">
<title>Sai Elegance Coupon</title>
<style>
:root{--wine:#741323;--cream:#fff8ec;--silver:#bfc2c6;--ink:#2b1b17;--green:#168a55;--red:#b4232c}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#eee8df,#ded4c8);font-family:Inter,system-ui,Arial;color:var(--ink);padding:18px}.coupon{width:min(760px,100%);background:var(--cream);border:4px solid var(--silver);border-radius:18px;box-shadow:0 22px 60px #24160f30;overflow:hidden}.head{padding:20px 24px;border-bottom:1px solid #e2d6c7;display:flex;justify-content:space-between;align-items:center;gap:12px}.brand{font:700 30px Georgia,serif;color:var(--wine)}.body{padding:28px}.offer{font:700 clamp(38px,8vw,74px) Georgia,serif;color:var(--wine);line-height:.95;margin:8px 0 12px}.code{font-weight:900;letter-spacing:.12em;margin:14px 0;padding:12px;background:#fff;border:1px dashed #bda994;border-radius:10px}.status{display:inline-block;padding:7px 12px;border-radius:999px;font-weight:900;font-size:13px}.ACTIVE{background:#dcf6e8;color:#12633e}.REDEEMED,.EXPIRED,.VOID{background:#fde4e4;color:#8f1d25}.terms{font-size:17px;line-height:1.55}.foot{padding:15px 24px;background:var(--wine);color:#fff;font-size:13px}.error{color:#8f1d25;font-weight:800}.loading{color:#6b625c}
</style>
</head>
<body>
<div class="coupon">
  <div class="head"><div class="brand">Sai Elegance</div><div id="status" class="status">LOADING</div></div>
  <div class="body"><div id="content" class="loading">Validating your coupon...</div></div>
  <div class="foot">One-time digital coupon • Show this page at the Sai Elegance counter</div>
</div>
<script>
const API='https://lwsvlxgmqpcnscnsootw.supabase.co/functions/v1/coupon-api';
function couponParams(){
  const hash=new URLSearchParams(location.hash.replace(/^#/,''));
  const query=new URLSearchParams(location.search);
  return {
    code:(hash.get('coupon')||query.get('coupon')||'').trim(),
    token:hash.get('token')||query.get('token')||''
  };
}
async function run(){
  try{
    const {code,token}=couponParams();
    if(!code||!token) throw new Error('Invalid coupon link.');
    const u=new URL(API);
    u.searchParams.set('coupon',code);
    u.searchParams.set('token',token);
    const r=await fetch(u.toString(),{cache:'no-store',referrerPolicy:'no-referrer'});
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||'Invalid coupon.');
    const s=document.getElementById('status');
    s.textContent=j.status;
    s.className='status '+j.status;
    const offer=j.coupon_type==='FREE_SANDWICH'?'FREE SANDWICH':'50% OFF CAFÉ BITES';
    const terms=j.coupon_type==='FREE_SANDWICH'
      ?'Valid for one free sandwich. One-time use only.'
      :`Valid for one eligible café order between ₹${j.min_order} and ₹${j.max_order}. One-time use only.`;
    document.getElementById('content').innerHTML=`<div class="offer">${offer}</div><div class="code">${j.code}</div><div class="terms">${terms}<br><b>Valid until:</b> ${new Date(j.expires_at).toLocaleDateString('en-IN')}</div>`;
  }catch(e){
    document.getElementById('status').textContent='INVALID';
    document.getElementById('status').className='status VOID';
    document.getElementById('content').innerHTML='<div class="error">'+String(e.message||e)+'</div>';
  }
}
run();
</script>
</body>
</html>
